<section class="certified-hero certified-hero--listing">
  <div class="certified-hero__copy">
    <span class="certified-hero__eyebrow">{{eyebrow}}</span>
    <h1>{{headline}}</h1>
    <p>{{subtitle}}</p>
    <form class="certified-hero__search" data-catalog-search-form><label><span>{{search_label}}</span><input type="search" name="catalog-search" aria-label="{{search_label}}"></label><button type="submit">{{search_label}}</button></form>
    <div class="certified-hero__actions"><a href="#{{primary_page_key}}" data-page-link="{{primary_page_key}}">{{primary_button}}</a><a href="#{{secondary_page_key}}" data-page-link="{{secondary_page_key}}">{{secondary_button}}</a></div>
  </div>
  <div class="certified-hero__media"><img src="{{image_1}}" alt="{{image_alt}}" loading="eager" decoding="async"></div>
</section>
