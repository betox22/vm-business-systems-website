<div class="rendered-site template-custom-order"><section class="custom-order" aria-labelledby="custom-order-heading"><div class="custom-order-intro"><div class="custom-order-copy"><h2 id="custom-order-heading">{{headline}}</h2><p>{{subtitle}}</p></div><div class="custom-order-media"><img class="custom-order-process" src="{{process_image}}" alt=""><img class="custom-order-texture" src="{{material_texture}}" alt=""></div></div><form class="custom-order-form"><label class="custom-order-upload"><span>{{upload_label}}</span><input type="file" accept=".stl,.obj,.3mf" disabled></label><div class="custom-order-fields"><label><span>{{name_label}}</span><input type="text" name="name" autocomplete="name" disabled></label><label><span>{{contact_label}}</span><input type="email" name="contact" autocomplete="email" disabled></label><label><span>{{material_label}}</span><input type="text" name="material" disabled></label><label><span>{{color_label}}</span><input type="text" name="color" disabled></label><label><span>{{quantity_label}}</span><input type="number" name="quantity" min="1" disabled></label><label class="custom-order-notes"><span>{{notes_label}}</span><textarea name="notes" rows="3" disabled></textarea></label></div><button type="button" disabled>{{submit_label}}</button></form></section></div>
