<section class="composed-services-hero">
  <div class="composed-services-hero__copy">
    <h1>{{headline}}</h1>
    <p>{{subtitle}}</p>
    <div class="composed-services-hero__actions">
      <a class="composed-services-hero__primary" href="#{{primary_page_key}}" data-page-link="{{primary_page_key}}">{{primary_button}}</a>
      <a class="composed-services-hero__secondary" href="#{{secondary_page_key}}" data-page-link="{{secondary_page_key}}">{{secondary_button}}</a>
    </div>
  </div>
  <img class="composed-services-hero__image" src="{{image_1}}" alt="{{image_alt}}">
</section>
