<div class="rendered-site template-digital-products-store"><section class="digital-bundle-section heading-medium spacing-spacious container-wide density-comfortable gap-comfortable variant-default" data-studio-section="digital_bundle" data-studio-section-type="DigitalBundle" data-studio-section-variant="default">
    <div class="section-heading">
      <span class="rendered-kicker">Digital products</span>
      <h2>{{title}}</h2>
      <p>{{text}}</p>
    </div>
    <div class="catalog-digital-pro catalog-count-1"><article data-catalog-item="" data-catalog-search="section_product_name sample category section_product_description" data-catalog-item-category="sample category">
    <div class="digital-card-top">
      <small>{{product.category}}</small>
      <span>Instant access</span>
    </div>
    <div class="image-shell"><img src="{{image_1}}" alt="{{product.name}}" loading="lazy" decoding="async" onerror="this.closest('.image-shell').classList.add('image-failed')"><div class="card-placeholder">SE</div></div>
    <h3>{{product.name}}</h3>
    <p>{{product.description}}</p>
    <ul><li>Downloadable content</li><li>Bonus resources</li><li>Lifetime access</li></ul>
    <div class="digital-card-bottom">
      <strong>{{product.price_label}}</strong>
      <button class="rendered-button" data-cart-add="" data-item-id="sample-product" data-item-name="{{product.name}}" data-item-price="{{product.price_label}}" data-item-image="/images/product-placeholder.svg" type="button">Add to cart</button>
    </div>
  </article></div>
  </section></div>
