<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="Mega Marketplace Phase 4 progress preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4df7ff"/>
      <stop offset="1" stop-color="#39d98a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d31"/>
      <stop offset="1" stop-color="#0c1628"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 48px Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font: 500 19px Arial, sans-serif; fill: #a8bdd4; }
      .section-title { font: 800 25px Arial, sans-serif; fill: #f8fafc; }
      .label { font: 800 13px Arial, sans-serif; fill: #6fffea; text-transform: uppercase; letter-spacing: 1px; }
      .body { font: 500 16px Arial, sans-serif; fill: #c8d6e5; }
      .small { font: 600 13px Arial, sans-serif; fill: #8fa6bf; }
      .tiny { font: 700 11px Arial, sans-serif; fill: #0b1220; }
      .pillText { font: 800 12px Arial, sans-serif; fill: #061321; }
      .mono { font: 700 13px Consolas, monospace; fill: #d9faff; }
      .panel { fill: url(#panel); stroke: #263851; stroke-width: 1; filter: url(#shadow); }
      .card { fill: #111d31; stroke: #29415e; stroke-width: 1; }
      .line { stroke: #2e4a68; stroke-width: 2; }
      .check { fill: #2ff0aa; }
      .warn { fill: #ffd166; }
      .accent { fill: url(#cyan); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1320" cy="140" r="220" fill="#20f7d2" opacity="0.06"/>
  <circle cx="180" cy="820" r="280" fill="#3b82f6" opacity="0.08"/>

  <text x="70" y="80" class="label">KREATON template system</text>
  <text x="70" y="135" class="title">Mega Marketplace - Phase 4 Progress</text>
  <text x="70" y="170" class="subtitle">Frontend architecture is mapped before visual implementation: screens, data, states, actions, and security boundaries.</text>

  <rect x="70" y="215" width="460" height="285" rx="28" class="panel"/>
  <text x="105" y="260" class="section-title">Buyer storefront</text>
  <text x="105" y="292" class="small">Public shopping experience</text>
  <rect x="105" y="325" width="170" height="36" rx="18" class="accent"/>
  <text x="130" y="348" class="pillText">search-first home</text>
  <rect x="292" y="325" width="150" height="36" rx="18" fill="#1f3350"/>
  <text x="322" y="348" class="small" fill="#dff">catalog</text>
  <rect x="105" y="378" width="150" height="36" rx="18" fill="#1f3350"/>
  <text x="132" y="401" class="small" fill="#dff">product detail</text>
  <rect x="272" y="378" width="120" height="36" rx="18" fill="#1f3350"/>
  <text x="313" y="401" class="small" fill="#dff">cart</text>
  <rect x="405" y="378" width="95" height="36" rx="18" fill="#1f3350"/>
  <text x="425" y="401" class="small" fill="#dff">checkout</text>
  <text x="105" y="455" class="body">Defined: product grid, category paths, vendor grouped cart, quote-first checkout, idempotency key.</text>

  <rect x="570" y="215" width="460" height="285" rx="28" class="panel"/>
  <text x="605" y="260" class="section-title">Vendor portal</text>
  <text x="605" y="292" class="small">Seller operations and scoped data</text>
  <rect x="605" y="325" width="140" height="36" rx="18" class="accent"/>
  <text x="633" y="348" class="pillText">dashboard</text>
  <rect x="760" y="325" width="145" height="36" rx="18" fill="#1f3350"/>
  <text x="790" y="348" class="small" fill="#dff">products</text>
  <rect x="605" y="378" width="115" height="36" rx="18" fill="#1f3350"/>
  <text x="637" y="401" class="small" fill="#dff">orders</text>
  <rect x="735" y="378" width="115" height="36" rx="18" fill="#1f3350"/>
  <text x="767" y="401" class="small" fill="#dff">ledger</text>
  <rect x="865" y="378" width="125" height="36" rx="18" fill="#1f3350"/>
  <text x="894" y="401" class="small" fill="#dff">settings</text>
  <text x="605" y="455" class="body">Defined: vendor-owned products, fulfillment flow, ledger visibility, payout summaries, no admin controls.</text>

  <rect x="1070" y="215" width="460" height="285" rx="28" class="panel"/>
  <text x="1105" y="260" class="section-title">Admin marketplace</text>
  <text x="1105" y="292" class="small">Platform operator control layer</text>
  <rect x="1105" y="325" width="150" height="36" rx="18" class="accent"/>
  <text x="1137" y="348" class="pillText">overview</text>
  <rect x="1270" y="325" width="160" height="36" rx="18" fill="#1f3350"/>
  <text x="1297" y="348" class="small" fill="#dff">vendor approval</text>
  <rect x="1105" y="378" width="170" height="36" rx="18" fill="#1f3350"/>
  <text x="1133" y="401" class="small" fill="#dff">moderation</text>
  <rect x="1290" y="378" width="110" height="36" rx="18" fill="#1f3350"/>
  <text x="1325" y="401" class="small" fill="#dff">orders</text>
  <rect x="1415" y="378" width="82" height="36" rx="18" fill="#1f3350"/>
  <text x="1432" y="401" class="small" fill="#dff">settings</text>
  <text x="1105" y="455" class="body">Defined: approvals, product moderation, global orders, marketplace settings, audit-sensitive actions.</text>

  <rect x="70" y="550" width="1460" height="245" rx="30" class="panel"/>
  <text x="105" y="595" class="section-title">Build flow already defined</text>
  <text x="105" y="625" class="small">This is the functional path the real UI must implement next.</text>

  <g transform="translate(105 665)">
    <rect width="190" height="80" rx="20" class="card"/>
    <circle cx="35" cy="40" r="17" class="accent"/>
    <text x="31" y="45" class="tiny">1</text>
    <text x="68" y="34" class="body">Home</text>
    <text x="68" y="57" class="small">Search + discovery</text>
  </g>
  <line x1="300" y1="705" x2="350" y2="705" class="line"/>
  <g transform="translate(355 665)">
    <rect width="190" height="80" rx="20" class="card"/>
    <circle cx="35" cy="40" r="17" class="accent"/>
    <text x="31" y="45" class="tiny">2</text>
    <text x="68" y="34" class="body">Catalog</text>
    <text x="68" y="57" class="small">Filters + products</text>
  </g>
  <line x1="550" y1="705" x2="600" y2="705" class="line"/>
  <g transform="translate(605 665)">
    <rect width="190" height="80" rx="20" class="card"/>
    <circle cx="35" cy="40" r="17" class="accent"/>
    <text x="31" y="45" class="tiny">3</text>
    <text x="68" y="34" class="body">Product</text>
    <text x="68" y="57" class="small">Variants + seller</text>
  </g>
  <line x1="800" y1="705" x2="850" y2="705" class="line"/>
  <g transform="translate(855 665)">
    <rect width="190" height="80" rx="20" class="card"/>
    <circle cx="35" cy="40" r="17" class="accent"/>
    <text x="31" y="45" class="tiny">4</text>
    <text x="68" y="34" class="body">Cart</text>
    <text x="68" y="57" class="small">Grouped by vendor</text>
  </g>
  <line x1="1050" y1="705" x2="1100" y2="705" class="line"/>
  <g transform="translate(1105 665)">
    <rect width="190" height="80" rx="20" class="card"/>
    <circle cx="35" cy="40" r="17" class="accent"/>
    <text x="31" y="45" class="tiny">5</text>
    <text x="68" y="34" class="body">Checkout</text>
    <text x="68" y="57" class="small">Backend quote</text>
  </g>
  <line x1="1300" y1="705" x2="1350" y2="705" class="line"/>
  <g transform="translate(1355 665)">
    <rect width="140" height="80" rx="20" class="card"/>
    <circle cx="35" cy="40" r="17" class="accent"/>
    <text x="31" y="45" class="tiny">6</text>
    <text x="68" y="34" class="body">Order</text>
    <text x="68" y="57" class="small">Vendor split</text>
  </g>

  <rect x="70" y="835" width="460" height="90" rx="24" class="card"/>
  <circle cx="110" cy="880" r="16" class="check"/>
  <text x="102" y="886" class="tiny">OK</text>
  <text x="140" y="874" class="body">Validated contracts</text>
  <text x="140" y="898" class="small">JSON + cart tests + API contract tests passed.</text>

  <rect x="570" y="835" width="460" height="90" rx="24" class="card"/>
  <circle cx="610" cy="880" r="16" class="check"/>
  <text x="602" y="886" class="tiny">OK</text>
  <text x="640" y="874" class="body">Brand-safe wording</text>
  <text x="640" y="898" class="small">No external marketplace brand names in template files.</text>

  <rect x="1070" y="835" width="460" height="90" rx="24" class="card"/>
  <circle cx="1110" cy="880" r="16" class="warn"/>
  <text x="1102" y="886" class="tiny">NEXT</text>
  <text x="1140" y="874" class="body">Pending approval</text>
  <text x="1140" y="898" class="small">Next: build component preview, then visual design.</text>
</svg>
