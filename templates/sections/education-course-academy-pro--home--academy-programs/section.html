        <li>Flexible access</li>
      </ul>
      <div><strong>{{product.price_label}}</strong><a class="rendered-button" href="#" data-inline-edit-path="catalog_items.0.button_label" data-inline-edit-field="primary_button" data-inline-edit-mode="single" data-inline-edit-max-length="48" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Add button text" tabindex="0" aria-label="Edit primary button">Enroll now</a></div>
