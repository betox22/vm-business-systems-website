<div class="rendered-site template-manufacturing-industrial-supplier-pro"><section class="rendered-section section-industrial-specs heading-medium spacing-compact container-wide density-comfortable gap-comfortable variant-default" data-studio-section="industrial_products" data-studio-section-type="ProductGrid" data-studio-section-variant="default">
    <div class="section-heading">
      <span class="rendered-kicker">{{business.tone}}</span>
      <h2 data-inline-edit-path="pages.1.sections.0.editable.title" data-inline-edit-field="title" data-inline-edit-mode="single" data-inline-edit-max-length="140" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Write a section title" tabindex="0" aria-label="Edit title">{{title}}</h2>
      <p data-inline-edit-path="pages.1.sections.0.editable.text" data-inline-edit-field="text" data-inline-edit-mode="multiline" data-inline-edit-max-length="520" data-inline-edit-max-lines="6" data-inline-edit-placeholder="Write section copy here" tabindex="0" aria-label="Edit text">{{text}}</p>
    </div>
    <div class="catalog-minimal"><article class="minimal-card" data-catalog-item="" data-catalog-search="section_product_name sample category section_product_description" data-catalog-item-category="sample category">
    <div class="image-shell"><img src="{{image_1}}" alt="{{product.name}}" loading="lazy" decoding="async" onerror="this.closest('.image-shell').classList.add('image-failed')"><div class="card-placeholder">SE</div></div>
    <small>{{product.price_label}}</small>
    <small>{{product.category}}</small>
    <h3>{{product.name}}</h3>
    <p>{{product.description}}</p>
    
    <b>{{product.price_label}}</b>
    
    <button class="rendered-button" data-open-lead="" data-item-id="sample-product" data-item-name="{{product.name}}" type="button">View</button>
  </article></div>
  </section></div>
