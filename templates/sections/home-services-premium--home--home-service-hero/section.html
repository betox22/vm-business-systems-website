<section class="composed-home-service-hero">
  <div class="composed-home-service-hero__visual"><img src="{{image_1}}" alt="{{image_alt}}"></div>
  <div class="composed-home-service-hero__copy">
    <span class="composed-home-service-hero__eyebrow">{{service_category}}</span>
    <h1>{{headline}}</h1>
    <p>{{subtitle}}</p>
    <div class="composed-home-service-hero__actions">
      <a class="composed-home-service-hero__primary" href="#{{primary_page_key}}" data-page-link="{{primary_page_key}}">{{primary_button}}</a>
      <a class="composed-home-service-hero__secondary" href="#{{secondary_page_key}}" data-page-link="{{secondary_page_key}}">{{secondary_button}}</a>
    </div>
  </div>
</section>
