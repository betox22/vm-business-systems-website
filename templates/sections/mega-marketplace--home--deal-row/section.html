<div class="rendered-site template-mega-marketplace"><section class="marketplace-deal-section heading-medium spacing-compact container-wide density-comfortable gap-comfortable variant-default" data-studio-section="deal_row" data-studio-section-type="DealRow" data-studio-section-variant="default">
    <div class="section-heading">
      <span class="rendered-kicker">Deal</span>
      <h2>{{title}}</h2>
      <p>{{text}}</p>
    </div>
    <div class="marketplace-deal-row catalog-count-1"><article class="market-card deal-card" data-catalog-item="" data-catalog-search="section_product_name sample category section_product_description" data-catalog-item-category="sample category">
    <div class="image-shell"><img src="{{image_1}}" alt="{{product.name}}" loading="lazy" decoding="async" onerror="this.closest('.image-shell').classList.add('image-failed')"><div class="card-placeholder">SE</div></div>
    <small>Deal</small>
    <small>{{product.category}}</small>
    <h3>{{product.name}}</h3>
    <p>{{product.description}}</p>
    <div class="market-meta"><span>★★★★ 4.6</span><span>Fast ship</span></div>
    <b>{{product.price_label}}</b>
    
    <button class="rendered-button" data-cart-add="" data-item-id="sample-product" data-item-name="{{product.name}}" data-item-price="{{product.price_label}}" data-item-image="/images/product-placeholder.svg" type="button">Add to cart</button>
  </article></div>
  </section></div>
