<section class="composed-luxury-hero">
  <div class="composed-luxury-hero__copy">
    <h1>{{headline}}</h1>
    <p>{{subtitle}}</p>
    <div class="composed-luxury-hero__actions">
      <a class="composed-luxury-hero__primary" href="#{{primary_page_key}}" data-page-link="{{primary_page_key}}">{{primary_button}}</a>
      <a class="composed-luxury-hero__secondary" href="#{{secondary_page_key}}" data-page-link="{{secondary_page_key}}">{{secondary_button}}</a>
    </div>
  </div>
  <figure class="composed-luxury-hero__media"><img src="{{image_1}}" alt="{{image_alt}}"></figure>
</section>
