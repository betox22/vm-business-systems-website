<div class="rendered-site template-real-estate-listings-pro"><section class="listing-pro-hero heading-medium spacing-compact container-wide density-comfortable gap-comfortable variant-default" data-studio-section="listing_hero" data-studio-section-type="ListingHero" data-studio-section-variant="default">
    <div class="listing-pro-copy">
      <span class="rendered-kicker">Areas</span>
      <h1>{{headline}}</h1>
      <p>{{subtitle}}</p>
      <label class="listing-search-bar">
        <span>Search</span>
        <input readonly="" value="" placeholder="{{search_placeholder}}">
        <button type="button">{{primary_button}}</button>
      </label>
      <div class="listing-quick-filters"><span>{{product.category}}</span><span>Homes</span><span>Rentals</span><span>Commercial</span></div>
    </div>
    <div class="listing-pro-stage">
      <div class="listing-map-card"><img src="{{image_1}}" alt="{{business.name}}"></div>
      <article class="listing-floating-card">
        <small>Featured listing</small>
        <strong>{{product.name}}</strong>
        <span>Downtown</span>
        <b>{{product.price_label}}</b>
      </article>
    </div>
  </section></div>
