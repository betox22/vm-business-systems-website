<div class="rendered-site template-premium-product-store"><section class="premium-feature-showcase heading-medium spacing-spacious container-wide density-comfortable gap-comfortable variant-feature-band" data-studio-section="premium_feature" data-studio-section-type="FeatureShowcase" data-studio-section-variant="feature_band">
    <div class="section-heading">
      <span class="rendered-kicker">{{business.industry}}</span>
      <h2 data-inline-edit-path="pages.0.sections.4.editable.title" data-inline-edit-field="title" data-inline-edit-mode="single" data-inline-edit-max-length="140" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Write a section title" tabindex="0" aria-label="Edit title">{{title}}</h2>
      <p data-inline-edit-path="pages.0.sections.4.editable.text" data-inline-edit-field="text" data-inline-edit-mode="multiline" data-inline-edit-max-length="520" data-inline-edit-max-lines="6" data-inline-edit-placeholder="Write section copy here" tabindex="0" aria-label="Edit text">{{text}}</p>
    </div>
    <div class="premium-feature-grid">
      <article>
        <span class="premium-feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 5 6 5 10a5 5 0 0 1-10 0c0-4 2-6 5-10Z"></path><path d="M9 15c1 1 2 1.5 3 1.5"></path></svg></span>
        <small>Signature</small>
        <h3 data-inline-edit-path="catalog_items.0.name" data-inline-edit-field="product_name" data-inline-edit-mode="single" data-inline-edit-max-length="120" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Write a product or service name" tabindex="0" aria-label="Edit product name">{{product.name}}</h3>
        <p data-inline-edit-path="catalog_items.0.description" data-inline-edit-field="product_description" data-inline-edit-mode="multiline" data-inline-edit-max-length="420" data-inline-edit-max-lines="5" data-inline-edit-placeholder="Write a product or service description" tabindex="0" aria-label="Edit product description">{{product.description}}</p>
      </article>
    </div>
  </section></div>
