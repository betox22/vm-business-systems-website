<div class="rendered-site template-real-estate-listings-pro"><section class="listing-featured-section heading-medium spacing-balanced container-wide density-comfortable gap-comfortable variant-default" data-studio-section="featured_listings" data-studio-section-type="ListingFeatured" data-studio-section-variant="default">
    <div class="section-heading"><span class="rendered-kicker">Listings</span><h2>{{title}}</h2><p>{{text}}</p></div>
    <div class="catalog-real-estate-listings"><article class="featured">
    <div class="listing-image"><div class="image-shell"><img src="{{image_1}}" alt="{{product.name}}" loading="lazy" decoding="async" onerror="this.closest('.image-shell').classList.add('image-failed')"><div class="card-placeholder">SE</div></div></div>
    <div class="listing-card-body">
      <div class="listing-card-top"><small>Available now</small><span>{{product.category}}</span></div>
      <h3>{{product.name}}</h3>
      <p>{{product.description}}</p>
      <div class="listing-spec-row"><span>Downtown</span><span>2 bd</span><span>1 ba</span></div>
      <div class="listing-card-bottom"><strong>{{product.price_label}}</strong><a class="rendered-button" href="#">Inquire now</a></div>
    </div>
  </article></div>
  </section></div>
