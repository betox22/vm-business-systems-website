<div class="rendered-site template-fashion-drop-pro"><section class="fashion-hero heading-medium spacing-cinematic container-wide density-comfortable gap-comfortable variant-default" data-studio-section="fashion_hero" data-studio-section-type="FashionHero" data-studio-section-variant="default">
    <div class="fashion-hero-copy">
      <span class="rendered-kicker">{{business.industry}}</span>
      <h1 data-inline-edit-path="pages.0.sections.0.editable.headline" data-inline-edit-field="headline" data-inline-edit-mode="single" data-inline-edit-max-length="140" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Write a headline here" tabindex="0" aria-label="Edit headline">{{headline}}</h1>
      <p data-inline-edit-path="pages.0.sections.0.editable.subtitle" data-inline-edit-field="subtitle" data-inline-edit-mode="multiline" data-inline-edit-max-length="320" data-inline-edit-max-lines="3" data-inline-edit-placeholder="Write supporting text here" tabindex="0" aria-label="Edit subtitle">{{subtitle}}</p>
      <div class="rendered-actions">
        <a class="rendered-button" href="#" data-inline-edit-path="pages.0.sections.0.editable.primary_button" data-inline-edit-field="primary_button" data-inline-edit-mode="single" data-inline-edit-max-length="48" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Add button text" tabindex="0" aria-label="Edit primary button">{{primary_button}}</a>
        <a class="rendered-button secondary" href="#" data-inline-edit-path="pages.0.sections.0.editable.secondary_button" data-inline-edit-field="secondary_button" data-inline-edit-mode="single" data-inline-edit-max-length="48" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Add button text" tabindex="0" aria-label="Edit secondary button">{{secondary_button}}</a>
      </div>
    </div>
    <div class="fashion-hero-visual"><img src="{{image_1}}" alt=""></div>
    <div class="fashion-hero-strip"><span data-inline-edit-path="catalog_items.0.name" data-inline-edit-field="product_name" data-inline-edit-mode="single" data-inline-edit-max-length="120" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Write a product or service name" tabindex="0" aria-label="Edit product name">{{product.name}}</span></div>
  </section></div>
