<div class="rendered-site template-luxury-high-ticket-pro"><section class="luxury-collection-section heading-medium spacing-spacious container-wide density-comfortable gap-comfortable variant-default" data-studio-section="luxury_collection" data-studio-section-type="LuxuryCollection" data-studio-section-variant="default">
    <div class="section-heading">
      <span class="rendered-kicker">Collection</span>
      <h2 data-inline-edit-path="pages.0.sections.2.editable.title" data-inline-edit-field="title" data-inline-edit-mode="single" data-inline-edit-max-length="140" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Write a section title" tabindex="0" aria-label="Edit title">{{title}}</h2>
      <p data-inline-edit-path="pages.0.sections.2.editable.text" data-inline-edit-field="text" data-inline-edit-mode="multiline" data-inline-edit-max-length="520" data-inline-edit-max-lines="6" data-inline-edit-placeholder="Write section copy here" tabindex="0" aria-label="Edit text">{{text}}</p>
    </div>
    <div class="catalog-luxury-high-ticket"><article class="featured">
    <div class="luxury-card-top"><div class="image-shell"><img src="{{image_1}}" alt="{{product.name}}" loading="lazy" decoding="async" onerror="this.closest('.image-shell').classList.add('image-failed')"><div class="card-placeholder">SE</div></div></div>
    <div class="luxury-card-bottom">
      <small>Limited piece</small>
      <h3 data-inline-edit-path="catalog_items.0.name" data-inline-edit-field="product_name" data-inline-edit-mode="single" data-inline-edit-max-length="120" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Write a product or service name" tabindex="0" aria-label="Edit product name">{{product.name}}</h3>
      <p data-inline-edit-path="catalog_items.0.description" data-inline-edit-field="product_description" data-inline-edit-mode="multiline" data-inline-edit-max-length="420" data-inline-edit-max-lines="5" data-inline-edit-placeholder="Write a product or service description" tabindex="0" aria-label="Edit product description">{{product.description}}</p>
      <div><span data-inline-edit-path="catalog_items.0.category" data-inline-edit-field="item_title" data-inline-edit-mode="single" data-inline-edit-max-length="120" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Write an item title" tabindex="0" aria-label="Edit item title">{{product.category}}</span><strong>{{product.price_label}}</strong></div>
      <a class="rendered-button secondary" href="#" data-inline-edit-path="catalog_items.0.button_label" data-inline-edit-field="primary_button" data-inline-edit-mode="single" data-inline-edit-max-length="48" data-inline-edit-max-lines="1" data-inline-edit-placeholder="Add button text" tabindex="0" aria-label="Edit primary button">Request private viewing</a>
    </div>
  </article></div>
  </section></div>
